name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests (reading order, fusion, zoom, reveal, navigation, learning)
        run: ./gradlew --no-daemon :engine:test

      - name: Detector benchmark (synthetic pages, OpenCV reference implementation)
        run: |
          pip install --quiet opencv-python-headless numpy
          python3 tools/detector_prototype.py

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaFlow-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: engine/build/reports/tests/
